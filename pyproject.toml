[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nekstat"
version = "0.1.0"
description = "Post-processing of Nek5000 on-the-fly wing statistics (NACA-4412 TBL): read interpolated int_fld, rotate to the wall frame, compute BL integral quantities, Reynolds-stress budgets and Cl/Cd."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Yuning Wang" }]
keywords = ["Nek5000", "CFD", "turbulence", "boundary-layer", "NACA4412",
            "post-processing", "spectral-element"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.6",
    "matplotlib>=3.3",
    "PyYAML>=5.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/yuning-w/nekstat"
Issues = "https://github.com/yuning-w/nekstat/issues"

[project.scripts]
nekstat = "nekstat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nekstat = ["py.typed"]
